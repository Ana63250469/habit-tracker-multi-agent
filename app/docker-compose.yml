services:
  habit-tracker:
    build: .
    container_name: habit-tracker
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    volumes:
      - habit-data:/data
    environment:
      DATABASE_URL: file:/data/habits.db
      JWT_SECRET: ${JWT_SECRET:-aa}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      NODE_ENV: production
      # Optional: skip the first-run setup wizard by pre-defining credentials
      # SETUP_USERNAME: ${SETUP_USERNAME}
      # SETUP_PASSWORD: ${SETUP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  habit-data:
    name: habit-tracker_habit-data
